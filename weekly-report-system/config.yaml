# 营销运作部周报收集系统
# ============================
# M365 认证
microsoft:
  client_id: ""           # Azure AD 应用注册的 client_id
  tenant_id: ""           # Azure AD tenant_id
  # client_secret 通过环境变量 M365_CLIENT_SECRET 注入

# 邮件规则（Graph API 模式）
email:
  subject_keywords: ["周报", "工作周报"]
  from_domain: ""         # 发件人域名，如 company.com
  scan_sender: "your-email@company.com"  # 接收周报的邮箱

# ============================
# 业务模块
# ============================
modules:
  - id: domestic_operator
    name: "国内运营商"
    format: excel
    # 该模块的成员列表
    members:
      # - name: "张三"
      #   email: "zhangsan@company.com"
      # 添加所有成员...

  # - id: sales
  #   name: "销售部"
  #   format: excel
  #   members: []

  # - id: marketing_ops
  #   name: "营销运营部"
  #   format: excel
  #   members: []

  # - id: overseas_bd
  #   name: "海外BD"
  #   format: ppt
  #   members: []

# ============================
# 本地文件模式（Phase 1）
# ============================
local:
  # 本地存放周报文件的目录，按模块分文件夹
  scan_dir: "data/raw/domestic_operator"
  file_pattern: "*.xlsx"

# ============================
# 模块列配置（Excel 模板差异）
# ============================
module_columns:
  domestic_operator:
    data_start_row: 3
    header_row: 2
    risk_column: "F"  # 风险列字母
    columns:
      A: "序号"
      B: "重点项目"
      C: "子目标/关键举措"
      D: "本周工作进展"
      E: "下周计划"
      F: "风险及求助"

  marketing_ops:
    data_start_row: 3
    header_row: 2
    risk_column: "D"   # 问题反馈&所需支持
    columns:
      A: "业务模块"
      B: "本周工作进展"
      C: "下周工作计划"
      D: "问题反馈&所需支持"
      E: "备注"

  sales:
    data_start_row: 3
    header_row: 2
    risk_column: "F"
    columns:
      A: "序号"
      B: "重点项目"
      C: "子目标/关键举措"
      D: "本周工作进展"
      E: "下周计划"
      F: "风险及求助"

  overseas_bd:
    data_start_row: 3
    header_row: 2
    risk_column: "F"
    columns:
      A: "序号"
      B: "重点项目"
      C: "子目标/关键举措"
      D: "本周工作进展"
      E: "下周计划"
      F: "风险及求助"

# ============================
# 投递
# ============================
superior:
  name: "领导"
  email: ""

# ============================
# AI 分析
# ============================
claude:
  model: "claude-sonnet-5"
  max_tokens: 4000
